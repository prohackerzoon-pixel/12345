<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Shipments — NexaCargo</title>
  <link rel="stylesheet" href="assets/styles.css"/>
</head>
<body>

<div id="loading-screen">
  <div class="loading-grid"></div>
  <div class="loading-rings"><div class="ring ring-1"></div><div class="ring ring-2"></div><div class="ring ring-3"></div><div class="loading-logo">N</div></div>
  <h1 class="loading-title">NexaCargo</h1>
  <p class="loading-subtitle">Worldwide Logistics</p>
  <div class="loading-dots"><span></span><span></span><span></span></div>
  <p class="loading-msg" id="loading-msg">Loading shipments...</p>
  <p class="loading-tagline">"Delivering Trust, Worldwide"</p>
</div>

<div class="app-shell" id="app-shell">
  <div class="main-area">
    <div class="page-content">

      <div class="page-header">
        <div><h1>My Shipments</h1><p id="ship-count">All your shipments and requests</p></div>
        <a href="place.html" class="btn btn-primary btn-sm">+ New Request</a>
      </div>

      <!-- Tabs -->
      <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;" id="tab-bar">
        <button class="btn btn-sm btn-secondary" id="tab-all"       onclick="setTab('all')"       style="background:var(--accent);color:#000;border-color:var(--accent);">All</button>
        <button class="btn btn-sm btn-secondary" id="tab-requests"  onclick="setTab('requests')">⏳ Pending Requests</button>
        <button class="btn btn-sm btn-secondary" id="tab-shipments" onclick="setTab('shipments')">📦 Active Shipments</button>
        <button class="btn btn-sm btn-secondary" id="tab-delivered" onclick="setTab('delivered')">✅ Delivered</button>
      </div>

      <!-- Requests section -->
      <div id="requests-section">
        <div class="section-label" style="margin-bottom:10px;">Submitted Requests <span id="req-badge" style="color:var(--accent);"></span></div>
        <div id="requests-list"></div>
      </div>

      <!-- Shipments section -->
      <div id="shipments-section">
        <div class="section-label" style="margin-top:18px;margin-bottom:10px;">Registered Shipments <span id="ship-badge" style="color:var(--accent);"></span></div>
        <div class="card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Tracking ID</th><th>Description</th><th>Destination</th><th>Status</th><th>Date</th></tr>
              </thead>
              <tbody id="ships-body"><tr><td colspan="5" class="table-empty">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="assets/app.js"></script>
<script src="assets/layout.js"></script>
<script>
  if (!Auth.requireAuth()) throw new Error();
  initLoadingScreen(['Loading shipments...'], 1800);

  let allRequests = [];
  let allShipments = [];
  let currentTab = 'all';

  function setTab(tab) {
    currentTab = tab;
    document.querySelectorAll('[id^="tab-"]').forEach(b => {
      b.style.background = ''; b.style.color = ''; b.style.borderColor = '';
    });
    const active = document.getElementById('tab-' + tab);
    if (active) { active.style.background = 'var(--accent)'; active.style.color = '#000'; active.style.borderColor = 'var(--accent)'; }
    renderContent();
  }

  function renderContent() {
    const reqSection  = document.getElementById('requests-section');
    const shipSection = document.getElementById('shipments-section');

    const showReqs  = currentTab === 'all' || currentTab === 'requests';
    const showShips = currentTab === 'all' || currentTab === 'shipments' || currentTab === 'delivered';

    reqSection.style.display  = showReqs  ? 'block' : 'none';
    shipSection.style.display = showShips ? 'block' : 'none';

    // Render requests
    if (showReqs) renderRequests();
    // Render shipments
    if (showShips) renderShipments();
  }

  function renderRequests() {
    const container = document.getElementById('requests-list');
    const filtered = currentTab === 'all'
      ? allRequests
      : allRequests.filter(r => r.status === 'new' || r.status === 'processing');

    document.getElementById('req-badge').textContent = filtered.length ? `(${filtered.length})` : '';

    if (!filtered.length) {
      container.innerHTML = `<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;color:var(--faint);font-size:13px;">No pending requests. <a href="place.html" style="color:var(--accent);">Place one now →</a></div>`;
      return;
    }

    container.innerHTML = filtered.map(r => {
      const statusColor = r.status==='converted' ? 'var(--success)' : r.status==='rejected' ? 'var(--danger)' : 'var(--accent)';
      const statusText  = r.status==='new' ? '⏳ Pending Review' : r.status==='processing' ? '✅ Approved' : r.status==='converted' ? '📦 Converted to Shipment' : '❌ Rejected';
      return `
        <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;border-left:3px solid ${statusColor};">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
            <div>
              <div style="font-size:13.5px;font-weight:700;color:var(--white);">To: ${r.delivery_address || '—'}</div>
              <div style="font-size:12px;color:var(--muted);margin-top:2px;">Country: ${r.delivery_country || '—'}</div>
            </div>
            <span style="font-size:11.5px;font-weight:600;color:${statusColor};background:${statusColor}18;padding:3px 10px;border-radius:20px;white-space:nowrap;">${statusText}</span>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <div><div style="font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;">Package</div><div style="font-size:12.5px;color:var(--text);">${r.package_description ? r.package_description.split('\n')[0].slice(0,50) : '—'}</div></div>
            <div><div style="font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;">Submitted</div><div style="font-size:12.5px;color:var(--text);">${fmtDate(r.created_at)}</div></div>
            ${r.weight ? `<div><div style="font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;">Weight</div><div style="font-size:12.5px;color:var(--text);">${r.weight}</div></div>` : ''}
            <div><div style="font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;">Pickup From</div><div style="font-size:12.5px;color:var(--text);">${r.pickup_address || '—'}</div></div>
          </div>
          ${r.status === 'new' || r.status === 'processing' ? `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);">💬 Our team will contact you via <a href="chat.html" style="color:var(--accent);font-weight:600;">Support Chat</a> to confirm details and pricing.</div>` : ''}
        </div>`;
    }).join('');
  }

  function renderShipments() {
    const tbody = document.getElementById('ships-body');
    let filtered = allShipments;
    if (currentTab === 'delivered') {
      filtered = allShipments.filter(s => (s.current_status||'').toLowerCase().includes('deliver'));
    } else if (currentTab === 'shipments') {
      filtered = allShipments.filter(s => !(s.current_status||'').toLowerCase().includes('deliver'));
    }

    document.getElementById('ship-badge').textContent = filtered.length ? `(${filtered.length})` : '';

    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="5" class="table-empty">No shipments here yet. ${currentTab==='all'?`<a href="place.html" style="color:var(--accent);">Place a request →</a>`:''}</td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(s => `
      <tr>
        <td><span class="td-link td-mono" onclick="location.href='shipment-detail.html?id=${s.id}'">${s.tracking_id}</span></td>
        <td class="td-muted" style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${s.package_description || '—'}</td>
        <td class="td-faint">${s.receiver_country || '—'}</td>
        <td>${statusBadge(s.current_status || 'Pending')}</td>
        <td class="td-faint">${fmtDate(s.created_at)}</td>
      </tr>`).join('');
  }

  async function loadAll() {
    try {
      // Load both in parallel
      const [reqData, shipData] = await Promise.allSettled([
        api.get('/user/requests'),
        api.get('/user/shipments')
      ]);

      if (reqData.status === 'fulfilled') {
        allRequests = reqData.value.requests || [];
      }
      if (shipData.status === 'fulfilled') {
        allShipments = shipData.value.shipments || [];
      }

      const total = allRequests.length + allShipments.length;
      document.getElementById('ship-count').textContent =
        `${allShipments.length} shipment${allShipments.length!==1?'s':''} · ${allRequests.length} request${allRequests.length!==1?'s':''}`;

      renderContent();
    } catch(e) {
      document.getElementById('ships-body').innerHTML =
        `<tr><td colspan="5" class="table-empty">Error: ${e.message}</td></tr>`;
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    initLayout('shipments');
    loadAll();
  });
</script>
</body>
</html>
